<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button
        menu="main-menu"
        aria-label="Abrir menú principal"
      ></ion-menu-button>
    </ion-buttons>

    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Accede a Vinyl Store</h1>
  <p>Introduce tu correo y contraseña.</p>

  <form [formGroup]="form" (ngSubmit)="signIn()">
    <ion-input
      class="ion-margin-bottom"
      label="Correo electrónico"
      labelPlacement="stacked"
      type="email"
      autocomplete="username"
      formControlName="email"
      errorText="Introduce un correo electrónico válido."
      [required]="true"
    ></ion-input>

    <ion-input
      class="ion-margin-bottom"
      label="Contraseña"
      labelPlacement="stacked"
      type="password"
      autocomplete="current-password"
      formControlName="password"
      errorText="Introduce tu contraseña."
      [required]="true"
    ></ion-input>

    @if (errorMessage()) {
      <p role="alert">{{ errorMessage() }}</p>
    }

    @if (successMessage()) {
      <p role="status">{{ successMessage() }}</p>
    }

    <ion-button type="submit" [disabled]="loading()">
      {{ loading() ? 'Accediendo…' : 'Iniciar sesión' }}
    </ion-button>
  </form>
</ion-content>
