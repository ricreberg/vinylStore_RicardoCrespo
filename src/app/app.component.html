<ion-app>
  <ion-split-pane contentId="main-content" when="lg">
    <ion-menu
      menuId="main-menu"
      contentId="main-content"
      type="overlay"
    >
      <ion-header class="menu-header">
        <ion-toolbar>
          <ion-title>
            <span class="brand">
              <span class="brand-record" aria-hidden="true"></span>

              <span class="brand-copy">
                <span class="brand-name">Vinyl Store</span>
                <span class="brand-caption">Discos para tu colección</span>
              </span>
            </span>
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <div class="menu-layout">
          <nav aria-label="Navegación principal">
            @for (section of menuSections(); track section.title) {
              <ion-list>
                <ion-list-header>
                  <ion-label>{{ section.title }}</ion-label>
                </ion-list-header>

                @for (link of section.links; track link.url) {
                  <ion-menu-toggle
                    menu="main-menu"
                    [autoHide]="false"
                  >
                    <ion-item
                      [routerLink]="link.url"
                      routerDirection="root"
                      routerLinkActive="selected"
                      [routerLinkActiveOptions]="{ exact: true }"
                      ariaCurrentWhenActive="page"
                      [detail]="false"
                      lines="none"
                    >
                      <ion-label>{{ link.title }}</ion-label>
                    </ion-item>
                  </ion-menu-toggle>
                }
              </ion-list>
            }
          </nav>

          <div class="menu-note">
            <button
              class="theme-toggle"
              type="button"
              aria-label="Modo oscuro"
              [attr.aria-pressed]="tema.esOscuro()"
              [title]="tema.esOscuro() ? 'Activar modo claro' : 'Activar modo oscuro'"
              (click)="tema.alternar()"
            >
              <span class="theme-toggle-copy">
                @if (tema.esOscuro()) {
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M20.8 13.1A9 9 0 0 1 10.9 3.2 9 9 0 1 0 20.8 13.1Z" />
                  </svg>
                } @else {
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                  </svg>
                }

                <span>{{ tema.esOscuro() ? 'Modo oscuro' : 'Modo claro' }}</span>
              </span>

              <span class="theme-toggle-track" aria-hidden="true">
                <span></span>
              </span>
            </button>

            <span class="menu-note-label">Tu próxima escucha</span>
            <p>Explora el catálogo y reserva para recoger en tienda.</p>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
