<ion-app>
  <ion-split-pane contentId="main-content" when="lg">
    <ion-menu
      menuId="main-menu"
      contentId="main-content"
      type="overlay"
    >
      <ion-header class="menu-header">
        <ion-toolbar>
          <ion-title>
            <span class="brand">
              <span class="brand-record" aria-hidden="true"></span>

              <span class="brand-copy">
                <span class="brand-name">Vinyl Store</span>
                <span class="brand-caption">Discos para tu colección</span>
              </span>
            </span>
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <div class="menu-layout">
          <nav aria-label="Navegación principal">
            @for (section of menuSections(); track section.title) {
              <ion-list>
                <ion-list-header>
                  <ion-label>{{ section.title }}</ion-label>
                </ion-list-header>

                @for (link of section.links; track link.url) {
                  <ion-menu-toggle
                    menu="main-menu"
                    [autoHide]="false"
                  >
                    <ion-item
                      [routerLink]="link.url"
                      routerDirection="root"
                      routerLinkActive="selected"
                      [routerLinkActiveOptions]="{ exact: true }"
                      ariaCurrentWhenActive="page"
                      [detail]="false"
                      lines="none"
                    >
                      <ion-label>{{ link.title }}</ion-label>
                    </ion-item>
                  </ion-menu-toggle>
                }
              </ion-list>
            }
          </nav>

          <div class="menu-note">
            <span class="menu-note-label">Tu próxima escucha</span>
            <p>Explora el catálogo y reserva para recoger en tienda.</p>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
